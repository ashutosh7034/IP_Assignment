<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6: Simple Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .calculator {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 350px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            min-height: 30px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>🔢 Calculator</h1>
        
        <div class="input-group">
            <label>First Number:</label>
            <input type="number" id="num1" placeholder="Enter first number">
        </div>
        
        <div class="input-group">
            <label>Second Number:</label>
            <input type="number" id="num2" placeholder="Enter second number">
        </div>
        
        <div class="input-group">
            <label>Operation:</label>
            <select id="operation">
                <option value="+">+ Addition</option>
                <option value="-">- Subtraction</option>
                <option value="*">× Multiplication</option>
                <option value="/">÷ Division</option>
            </select>
        </div>
        
        <button id="calculateBtn">Calculate</button>
        
        <p id="result"></p>
    </div>

    <script>
        // Get references to elements
        let num1Input = document.querySelector('#num1');
        let num2Input = document.querySelector('#num2');
        let operationSelect = document.querySelector('#operation');
        let calculateBtn = document.querySelector('#calculateBtn');
        let resultP = document.querySelector('#result');
        
        // Add click event listener
        calculateBtn.addEventListener('click', function() {
            // Get values and convert to numbers
            let num1 = Number(num1Input.value);
            let num2 = Number(num2Input.value);
            let operation = operationSelect.value;
            
            // Validate inputs
            if (num1Input.value === '' || num2Input.value === '') {
                alert('Please enter both numbers!');
                return;
            }
            
            let result;
            
            // Perform calculation based on operation
            if (operation === '+') {
                result = num1 + num2;
            } else if (operation === '-') {
                result = num1 - num2;
            } else if (operation === '*') {
                result = num1 * num2;
            } else if (operation === '/') {
                // Check for division by zero
                if (num2 === 0) {
                    alert('Error: Cannot divide by zero!');
                    return;
                }
                result = num1 / num2;
            }
            
            // Display result
            let operationSymbol = operation;
            if (operation === '*') operationSymbol = '×';
            if (operation === '/') operationSymbol = '÷';
            
            resultP.textContent = num1 + ' ' + operationSymbol + ' ' + num2 + ' = ' + result;
        });
    </script>
</body>
</html>
