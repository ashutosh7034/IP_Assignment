<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 3 - Employee Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
            font-size: 2em;
        }

        header p {
            opacity: 0.9;
            font-size: 0.95em;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.95em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .table-section {
            grid-column: 1 / -1;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .table-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        table thead {
            background: #667eea;
            color: white;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border: 1px solid #ddd;
        }

        table td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            font-size: 0.95em;
        }

        table tbody tr:hover {
            background: #f5f5f5;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
            flex: 1;
            margin: 0;
        }

        .btn-delete {
            background: #e74c3c;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .btn-edit {
            background: #3498db;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Employee Management System</h1>
            <p>Day 3 Project - Simple REST API CRUD Operations</p>
        </header>

        <div class="content">
            <div class="form-section">
                <h2>Add Employee</h2>
                <div id="message" class="message"></div>
                <form id="employeeForm">
                    <div class="form-group">
                        <label for="name">Employee Name *</label>
                        <input type="text" id="name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="department">Department *</label>
                        <input type="text" id="department" required placeholder="IT">
                    </div>
                    <div class="form-group">
                        <label for="salary">Salary *</label>
                        <input type="number" id="salary" required placeholder="50000" step="0.01">
                    </div>
                    <button type="submit">Add Employee</button>
                </form>
            </div>

            <div class="form-section">
                <h2>Search Employee</h2>
                <div class="form-group">
                    <label for="searchInput">Search by Name or Department</label>
                    <input type="text" id="searchInput" placeholder="Search...">
                </div>
                <button onclick="searchEmployees()">Search</button>
                <button onclick="getAllEmployees()" style="margin-top: 10px; background: #95a5a6;">Show All</button>
            </div>

            <div class="table-section">
                <h2>Employee List</h2>
                <div id="tableContainer">
                    <div class="no-data">Loading employees...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8080/api/employees';

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            getAllEmployees();
            document.getElementById('employeeForm').addEventListener('submit', handleAddEmployee);
            document.getElementById('searchInput').addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    searchEmployees();
                }
            });
        });

        async function getAllEmployees() {
            try {
                const response = await axios.get(API_BASE_URL);
                displayEmployees(response.data);
            } catch (error) {
                showMessage('Failed to load employees', 'error');
                console.error('Error fetching employees:', error);
            }
        }

        async function searchEmployees() {
            const searchTerm = document.getElementById('searchInput').value.trim();
            if (!searchTerm) {
                getAllEmployees();
                return;
            }

            try {
                const response = await axios.get(`${API_BASE_URL}/search/${searchTerm}`);
                displayEmployees(response.data);
            } catch (error) {
                showMessage('Search failed', 'error');
                console.error('Error searching:', error);
            }
        }

        function displayEmployees(employees) {
            const container = document.getElementById('tableContainer');
            
            if (!employees || employees.length === 0) {
                container.innerHTML = '<div class="no-data">No employees found</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            employees.forEach(emp => {
                html += `
                    <tr>
                        <td>${emp.id}</td>
                        <td>${emp.name}</td>
                        <td>${emp.department}</td>
                        <td>$${emp.salary.toFixed(2)}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-small btn-edit" onclick="editEmployee(${emp.id})">Edit</button>
                                <button class="btn-small btn-delete" onclick="deleteEmployee(${emp.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        async function handleAddEmployee(e) {
            e.preventDefault();
            
            const employee = {
                name: document.getElementById('name').value,
                department: document.getElementById('department').value,
                salary: parseFloat(document.getElementById('salary').value)
            };

            try {
                const response = await axios.post(API_BASE_URL, employee);
                showMessage('Employee added successfully!', 'success');
                document.getElementById('employeeForm').reset();
                getAllEmployees();
            } catch (error) {
                showMessage('Failed to add employee', 'error');
                console.error('Error adding employee:', error);
            }
        }

        async function editEmployee(id) {
            const name = prompt('Enter new name:');
            if (!name) return;
            
            const department = prompt('Enter new department:');
            if (!department) return;
            
            const salary = prompt('Enter new salary:');
            if (!salary) return;

            try {
                const updatedEmployee = {
                    name: name,
                    department: department,
                    salary: parseFloat(salary)
                };
                
                await axios.put(`${API_BASE_URL}/${id}`, updatedEmployee);
                showMessage('Employee updated successfully!', 'success');
                getAllEmployees();
            } catch (error) {
                showMessage('Failed to update employee', 'error');
                console.error('Error updating employee:', error);
            }
        }

        async function deleteEmployee(id) {
            if (!confirm('Are you sure you want to delete this employee?')) {
                return;
            }

            try {
                await axios.delete(`${API_BASE_URL}/${id}`);
                showMessage('Employee deleted successfully!', 'success');
                getAllEmployees();
            } catch (error) {
                showMessage('Failed to delete employee', 'error');
                console.error('Error deleting employee:', error);
            }
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type} show`;
            
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
