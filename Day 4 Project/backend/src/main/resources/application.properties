server.port=8080
spring.application.name=Day4-EmployeeManagement

# H2 File-based Database Configuration (Persistent)
spring.datasource.url=jdbc:h2:file:./data/employeedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.root=INFO
logging.level.com.employee=DEBUG

# JWT Configuration
jwt.secret=your_super_secret_key_that_is_at_least_32_characters_long_for_security
jwt.expiration=86400000
