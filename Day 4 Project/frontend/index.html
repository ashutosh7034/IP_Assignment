<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Employee Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --danger-color: #e74c3c;
            --success-color: #27ae60;
            --warning-color: #f39c12;
            --text-color: #333;
            --light-bg: #f8f9fa;
            --border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Login Page */
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .login-container.hidden {
            display: none;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .login-header p {
            color: #999;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 0.95em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-logout {
            background: var(--danger-color);
        }

        .btn-logout:hover {
            background: #c0392b;
        }

        .btn-delete {
            background: var(--danger-color);
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .btn-delete:hover {
            background: #c0392b;
        }

        .btn-edit {
            background: #3498db;
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .btn-edit:hover {
            background: #2980b9;
        }

        .btn-add {
            background: var(--success-color);
            margin-top: 10px;
        }

        .btn-add:hover {
            background: #229954;
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            color: #999;
        }

        .toggle-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Dashboard Page */
        .dashboard-container {
            width: 100%;
            max-width: 1400px;
            display: none;
        }

        .dashboard-container.show {
            display: block;
        }

        .dashboard {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .dashboard-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h1 {
            font-size: 2em;
        }

        .dashboard-header p {
            opacity: 0.9;
            margin-top: 5px;
        }

        .user-info {
            text-align: right;
        }

        .user-info p {
            margin-bottom: 10px;
        }

        .dashboard-content {
            padding: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            font-size: 0.95em;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }

        .form-section {
            background: var(--light-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 4px solid var(--primary-color);
        }

        .form-section h2 {
            color: var(--text-color);
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .table-section {
            background: var(--light-bg);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
        }

        .table-section h2 {
            color: var(--text-color);
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        table thead {
            background: var(--primary-color);
            color: white;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border: 1px solid var(--border-color);
        }

        table td {
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            font-size: 0.95em;
        }

        table tbody tr:hover {
            background: #f5f5f5;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.show {
            display: block;
        }

        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                text-align: center;
            }

            .user-info {
                text-align: center;
                margin-top: 15px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.85em;
            }

            table th, table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div class="login-container" id="loginPage">
        <div class="login-header">
            <h1>Employee Management</h1>
            <p>Day 4 - Advanced Spring Boot</p>
        </div>

        <div id="loginError" class="error-message"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" required placeholder="user">
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" required placeholder="user123">
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <div class="toggle-link">
            Don't have an account? <a onclick="toggleForm()">Register</a>
        </div>

        <!-- Register Form -->
        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label for="regFullName">Full Name</label>
                <input type="text" id="regFullName" required placeholder="Your Full Name">
            </div>
            <div class="form-group">
                <label for="regUsername">Username</label>
                <input type="text" id="regUsername" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" required placeholder="Min 6 characters">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <div class="toggle-link">
            Already have an account? <a onclick="toggleForm()">Login</a>
        </div>
    </div>

    <!-- Dashboard Page -->
    <div class="dashboard-container" id="dashboardPage">
        <div class="dashboard">
            <div class="dashboard-header">
                <div>
                    <h1>Employee Dashboard</h1>
                    <p>Manage your employee records</p>
                </div>
                <div class="user-info">
                    <p>Logged in as: <strong id="currentUser"></strong></p>
                    <button class="btn btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="dashboard-content">
                <div id="dashboardMessage" class="message"></div>

                <!-- Statistics -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Employees</h3>
                        <div class="stat-value" id="totalEmployees">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Average Salary</h3>
                        <div class="stat-value" id="averageSalary">$0</div>
                    </div>
                </div>

                <!-- Add Employee Form -->
                <div class="form-section">
                    <h2>Add New Employee</h2>
                    <form id="addEmployeeForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="empName">Name *</label>
                                <input type="text" id="empName" required placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label for="empDepartment">Department *</label>
                                <input type="text" id="empDepartment" required placeholder="IT">
                            </div>
                            <div class="form-group">
                                <label for="empSalary">Salary *</label>
                                <input type="number" id="empSalary" required placeholder="50000" step="0.01">
                            </div>
                            <div class="form-group">
                                <label for="empEmail">Email</label>
                                <input type="email" id="empEmail" placeholder="john@example.com">
                            </div>
                            <div class="form-group">
                                <label for="empPhone">Phone</label>
                                <input type="text" id="empPhone" placeholder="9999999999">
                            </div>
                            <div class="form-group">
                                <label for="empPosition">Position</label>
                                <input type="text" id="empPosition" placeholder="Developer">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-add">Add Employee</button>
                    </form>
                </div>

                <!-- Employee List -->
                <div class="table-section">
                    <h2>Employee List</h2>
                    <div id="employeeTableContainer">
                        <div class="no-data">Loading employees...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        let currentToken = localStorage.getItem('authToken');
        let currentUsername = localStorage.getItem('username');

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', () => {
            if (currentToken && currentUsername) {
                showDashboard();
                loadEmployeeData();
            } else {
                showLogin();
            }

            // Event listeners
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('registerForm').addEventListener('submit', handleRegister);
            document.getElementById('addEmployeeForm').addEventListener('submit', handleAddEmployee);
        });

        function toggleForm() {
            document.getElementById('loginForm').parentElement.style.display = 
                document.getElementById('loginForm').parentElement.style.display === 'none' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = 
                document.getElementById('registerForm').style.display === 'none' ? 'block' : 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await axios.post(`${API_BASE_URL}/auth/login`, {
                    username: username,
                    password: password
                });

                currentToken = response.data.token;
                currentUsername = response.data.username;
                
                localStorage.setItem('authToken', currentToken);
                localStorage.setItem('username', currentUsername);
                
                showDashboard();
                loadEmployeeData();
            } catch (error) {
                showLoginError(error.response?.data?.message || 'Login failed');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value;
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const response = await axios.post(`${API_BASE_URL}/auth/register`, {
                    fullName: fullName,
                    username: username,
                    email: email,
                    password: password
                });

                currentToken = response.data.token;
                currentUsername = response.data.username;
                
                localStorage.setItem('authToken', currentToken);
                localStorage.setItem('username', currentUsername);
                
                showDashboard();
                loadEmployeeData();
            } catch (error) {
                showLoginError(error.response?.data?.message || 'Registration failed');
            }
        }

        async function handleAddEmployee(e) {
            e.preventDefault();
            
            const employee = {
                name: document.getElementById('empName').value,
                department: document.getElementById('empDepartment').value,
                salary: parseFloat(document.getElementById('empSalary').value),
                email: document.getElementById('empEmail').value || null,
                phone: document.getElementById('empPhone').value || null,
                position: document.getElementById('empPosition').value || null
            };

            try {
                await axios.post(`${API_BASE_URL}/employees`, employee, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                
                showMessage('Employee added successfully!', 'success');
                document.getElementById('addEmployeeForm').reset();
                loadEmployeeData();
            } catch (error) {
                showMessage(error.response?.data?.message || 'Failed to add employee', 'error');
            }
        }

        async function deleteEmployee(id) {
            if (!confirm('Are you sure you want to delete this employee?')) {
                return;
            }

            try {
                await axios.delete(`${API_BASE_URL}/employees/${id}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                
                showMessage('Employee deleted successfully!', 'success');
                loadEmployeeData();
            } catch (error) {
                showMessage('Failed to delete employee', 'error');
            }
        }

        async function editEmployee(id) {
            const name = prompt('Enter new name:');
            if (!name) return;
            
            const department = prompt('Enter new department:');
            if (!department) return;
            
            const salary = prompt('Enter new salary:');
            if (!salary) return;

            try {
                const employee = {
                    name: name,
                    department: department,
                    salary: parseFloat(salary)
                };
                
                await axios.put(`${API_BASE_URL}/employees/${id}`, employee, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                
                showMessage('Employee updated successfully!', 'success');
                loadEmployeeData();
            } catch (error) {
                showMessage('Failed to update employee', 'error');
            }
        }

        async function loadEmployeeData() {
            try {
                const response = await axios.get(`${API_BASE_URL}/employees`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });

                displayEmployees(response.data);
                updateStats(response.data);
            } catch (error) {
                showMessage('Failed to load employees', 'error');
                console.error(error);
            }
        }

        function displayEmployees(employees) {
            const container = document.getElementById('employeeTableContainer');
            
            if (!employees || employees.length === 0) {
                container.innerHTML = '<div class="no-data">No employees found</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Position</th>
                            <th>Email</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            employees.forEach(emp => {
                html += `
                    <tr>
                        <td>${emp.id}</td>
                        <td>${emp.name}</td>
                        <td>${emp.department}</td>
                        <td>${emp.position || '-'}</td>
                        <td>${emp.email || '-'}</td>
                        <td>$${emp.salary.toFixed(2)}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn btn-edit" onclick="editEmployee(${emp.id})">Edit</button>
                                <button class="btn btn-delete" onclick="deleteEmployee(${emp.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        function updateStats(employees) {
            document.getElementById('totalEmployees').textContent = employees.length;
            
            if (employees.length > 0) {
                const avgSalary = employees.reduce((sum, emp) => sum + emp.salary, 0) / employees.length;
                document.getElementById('averageSalary').textContent = '$' + avgSalary.toFixed(2);
            }
        }

        function showLogin() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('dashboardPage').classList.remove('show');
        }

        function showDashboard() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('dashboardPage').classList.add('show');
            document.getElementById('currentUser').textContent = currentUsername;
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('username');
            currentToken = null;
            currentUsername = null;
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
            showLogin();
        }

        function showLoginError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 4000);
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('dashboardMessage');
            messageEl.textContent = text;
            messageEl.className = `message ${type} show`;
            
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
